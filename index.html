<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141927">
  <meta name="description" content="生年月日を一度登録するだけ。今日・今月・今年の運気を、静かな星の手帳で。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="六星手帳">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./style.css">
  <title>六星手帳 — 今日の星を、暮らしのヒントに。</title>
  <script defer src="./engine.js"></script>
  <script defer src="./data.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="六星手帳のホーム"><span class="brand-icon" aria-hidden="true">✦</span><span>六星手帳<small>ROKUSEI DIARY</small></span></a>
      <button class="icon-button" id="open-settings" aria-label="設定を開く">⚙</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="app-footer">今日の星を、暮らしのヒントに。<br><span>非公式アプリ · 独自解説 · v1.1.0 / 2026.10.03</span></footer>
  </div>
  <nav class="bottom-nav" id="nav" aria-label="メインメニュー" hidden>
    <button data-page="home"><span aria-hidden="true">✦</span>運勢</button>
    <button data-page="calendar"><span aria-hidden="true">▦</span>カレンダー</button>
    <button data-page="stars"><span aria-hidden="true">◎</span>運命星</button>
    <button data-page="compat"><span aria-hidden="true">♡</span>相性</button>
    <button data-page="settings"><span aria-hidden="true">⚙</span>設定</button>
  </nav>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div><button class="button secondary full" id="close-dialog">閉じる</button></dialog>
  <div class="update-banner" id="update-banner" hidden><span>新しいバージョンがあります</span><button id="apply-update">更新する</button></div>
  <noscript><p>このアプリを使用するには、ブラウザのJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
